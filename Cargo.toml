[package]
name = "reqray"
description = "Log 'request x-rays' for rust programs instrumented with `tracing`."
version = "0.5.0-alpha.0"
authors = ["Peter Kolloch <info@eigenvalue.net>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kolloch/reqray"
keywords = ["tracing", "profiling", "logging"]
categories = ["development-tools::profiling", "development-tools::debugging"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
quanta = "0.12.6"
thread_local = "1.1"

[dev-dependencies]
criterion = "0.8"
indoc = "2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "overhead"
harness = false

# Warnings fail CI (`cargo clippy --all-targets -- -D warnings`).
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Prefer `#[expect(lint, reason = "...")]`: it fails once the lint no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Leftovers from debugging and drafts.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Silent truncation matters for timings and counts.
as_conversions = "warn"

# Less debug info: line numbers in backtraces of this crate, none for
# dependencies. Set `debug = true` locally when a debugger needs variables.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
